<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cyberpunk Platformer</title>
    <style>
      * {
          box-sizing: border-box;
          user-select: none;
          -webkit-user-select: none;
          -webkit-tap-highlight-color: transparent;
      }

      html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          min-height: 100dvh;
          background-color: #090a0f;
          overflow: hidden;
          overscroll-behavior: none;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      #game-container {
          position: relative;
          width: 100%;
          height: 100%;
          max-width: 100vw;
          max-height: 100dvh;
          border: 2px solid #38bdf8;
          border-radius: 0;
          box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
          background: #030712;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          transition: width 0.15s ease, height 0.15s ease, border-radius 0.15s ease;
      }

      #game-container.compact-window {
          width: min(94vw, 1280px);
          height: auto;
          max-height: calc(100dvh - 20px);
          aspect-ratio: 1280 / 580;
          border-radius: 12px;
      }

      #gameCanvas {
          flex: 1 1 auto;
          min-height: 0;
          width: 100%;
          height: 100%;
          display: block;
          touch-action: none;
      }
    </style>
  
<style>
  /* Адаптивный кибер-магазин: всегда влезает целиком в экран / канвас */
  #shop-modal {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    max-width: 100% !important;
    max-height: 100dvh !important;
    padding: clamp(8px, 2vh, 18px) clamp(10px, 2.5vw, 24px) !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    z-index: 20000 !important;
  }

  #shop-modal > div {
    width: min(640px, 100%) !important;
    max-width: 100% !important;
    max-height: 100% !important;
    padding: clamp(12px, 2vh, 22px) !important;
    gap: clamp(8px, 1.4vh, 16px) !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    box-sizing: border-box !important;
  }

  #shop-modal h2 {
    font-size: clamp(16px, 2.6vh, 24px) !important;
    line-height: 1.15 !important;
  }

  #shop-list-container {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    padding-right: 4px !important;
    gap: clamp(6px, 1vh, 10px) !important;
  }

  #close-shop-btn {
    flex: 0 0 auto !important;
    padding: clamp(7px, 1.2vh, 10px) !important;
    font-size: clamp(13px, 2vh, 16px) !important;
  }
</style>

  </head>
  <body>
    <!-- Экран предзагрузки ассетов (Preloader) -->
    <div
      id="loading-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0d0f18;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        color: #00f0ff;
        font-family: 'Courier New', monospace;
      "
    >
      <h2 style="margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px #00f0ff;">
        CYBERPUNK RUNNER
      </h2>
      <div
        style="
          width: 280px;
          height: 16px;
          border: 2px solid #00f0ff;
          border-radius: 8px;
          padding: 2px;
          box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        "
      >
        <div
          id="loader-fill"
          style="
            width: 0%;
            height: 100%;
            background: #ec4899;
            border-radius: 4px;
            transition: width 0.2s;
          "
        ></div>
      </div>
      <div id="loader-text" style="margin-top: 12px; font-size: 14px; color: #aaa;">
        Инициализация систем... 0%
      </div>
    </div>

    <!-- Основной игровой холст внутри кибер-контейнера с рамкой -->
    <div id="game-container">
        <canvas id="gameCanvas" width="1280" height="580"></canvas>
    </div>

    <!-- Меню выбора персонажа -->
    <div
      id="character-select"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        font-family: monospace;
        color: #38bdf8;
      "
    >
      <h1 style="text-shadow: 0 0 10px #38bdf8; margin-bottom: 30px;">CHOOSE YOUR HERO</h1>
      <div style="display: flex; gap: 20px;">
        <button
          class="char-btn"
          data-char="Alisa"
          style="
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
          "
        >
          Alisa
        </button>
        <button
          class="char-btn"
          data-char="Chebur"
          style="
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
          "
        >
          Chebur
        </button>
        <button
          class="char-btn"
          data-char="Nancy"
          style="
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
          "
        >
          Nancy
        </button>
      </div>
    </div>
    <!-- Модальное окно кибер-магазина -->
<div
  id="shop-modal"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(3, 7, 18, 0.92);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20000;
    font-family: 'Courier New', monospace;
    color: #38bdf8;
  "
>
  <div
    style="
      width: 650px;
      max-width: 90vw;
      background: #090a0f;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    "
  >
    <!-- Шапка магазина -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px;">
      <h2 style="margin: 0; color: #00f0ff; text-shadow: 0 0 10px #00f0ff; letter-spacing: 2px;">CYBER SHOP</h2>
      <div style="font-size: 18px; color: #ec4899; text-shadow: 0 0 8px rgba(236,72,153,0.4);">
        БАЛАНС: <span id="player-credits">1000</span> CR
      </div>
    </div>

    <!-- Переключатель вкладок -->
    <div style="display: flex; gap: 10px;">
      <button id="tab-upgrades-btn" class="shop-tab-btn" style="background: #00f0ff; color: #030712; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px;">Улучшения</button>
      <button id="tab-materials-btn" class="shop-tab-btn" style="background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 8px 15px; cursor: pointer; border-radius: 4px;">Материалы</button>
    </div>

    <!-- Контейнер для динамического списка товаров -->
    <div id="shop-list-container" style="display: flex; flex-direction: column; gap: 12px; max-height: 320px; overflow-y: auto; padding-right: 5px;">
      <!-- Сюда JavaScript будет автоматически рендерить апгрейды или материалы из shopConfig.js -->
    </div>

    <!-- Кнопка закрытия -->
    <button id="close-shop-btn" style="background: transparent; border: 2px solid #38bdf8; color: #38bdf8; padding: 10px; font-family: monospace; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s;">
      [ ЗАКРЫТЬ ]
    </button>
  </div>
</div>

    <!-- Оверлей активации Fullscreen и первого тапа -->
    <div
      id="overlay-fullscreen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: rgba(3, 7, 18, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      "
    >
      <div
        style="
          color: #00ffcc;
          font-family: 'Courier New', monospace;
          font-size: 20px;
          text-align: center;
          text-shadow: 0 0 10px #00ffcc;
          border: 2px solid #00ffcc;
          padding: 20px;
          border-radius: 8px;
        "
      >
        [ НАЖМИТЕ ДЛЯ СТАРТА ]<br />
        <span style="font-size: 12px; color: #38bdf8">Активация кибер-модуля и Fullscreen</span>
      </div>
    </div>

    <script type="module" src="js/main.js?v=3.2382"></script>
  </body>
</html>
